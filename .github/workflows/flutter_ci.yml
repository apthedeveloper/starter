name: Flutter CI

on:
  push:
    branches:
      - main

concurrency:
  group: flutter-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  APP_NAME: STARTER_PROJECT

jobs:
  flutter-ci:
    name: Analyze, Test & Build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.41.2"
          cache: true

      - name: Create .env
        run: |
          echo "${{ secrets.ENV_FILE }}" > .env

      - name: Install Dependencies
        run: flutter pub get

      - name: Verify Formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze Code
        run: flutter analyze

      - name: Build APK
        run: flutter build apk --release

      - name: Rename APK
        run: |
          DATE=$(date +'%d-%b-%Y')
          APK_NAME="${APP_NAME} (${DATE}).apk"

          mv \
            build/app/outputs/flutter-apk/app-release.apk \
            "build/app/outputs/flutter-apk/${APK_NAME}"

          echo "APK_NAME=${APK_NAME}" >> $GITHUB_ENV

      - name: Verify APK Exists
        run: |
          ls -lah build/app/outputs/flutter-apk/

      - name: Create Firebase Service Account File
        run: |
          cat > firebase-service-account.json <<'EOF'
          ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          EOF

      - name: Set Google Application Credentials
        run: |
          echo "GOOGLE_APPLICATION_CREDENTIALS=${{ github.workspace }}/firebase-service-account.json" >> $GITHUB_ENV

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Upload APK to Firebase App Distribution
        run: |
          firebase appdistribution:distribute \
            "build/app/outputs/flutter-apk/${APK_NAME}" \
            --app "${{ secrets.FIREBASE_APP_ID }}" \
            --groups "testers" \
            --release-notes "Build from commit ${{ github.sha }} on branch ${{ github.ref_name }}"

      - name: Upload APK Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APK_NAME }}
          path: build/app/outputs/flutter-apk/${{ env.APK_NAME }}
          retention-days: 7